[tox]
envlist =
    py{310,311,312}-dj{42}-cms{311}
    py{310,311,312}-dj{51}-cms{311}

skip_missing_interpreters = True
requires =
    tox>=4.2
    uv

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg

set_env =
    PYTHONDEVMODE = 1

commands =
    python --version
    coverage run -m pytest {posargs:tests}

dependency_groups =
    test
    dj32: django32
    dj42: django42
    dj51: django51
    cms39: cms39
    cms310: cms310
    cms311: cms311
