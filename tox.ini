[tox]
envlist =
    py{38,39,310,311,312}-dj{32}-cms{37,38}
    py{38,39,310,311,312}-dj{42}-cms{38}

skip_missing_interpreters = True
requires =
    tox>=4.2
    uv

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg

set_env =
    PYTHONDEVMODE = 1

commands =
    python --version
    python -W error::ResourceWarning -W error::DeprecationWarning -W error::PendingDeprecationWarning -m coverage run -m pytest {posargs:tests}
    coverage report

dependency_groups =
    test
    dj32: django32
    dj42: django42
    cms37: cms37
    cms38: cms38
