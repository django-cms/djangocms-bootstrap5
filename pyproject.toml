[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
name = "djangocms-bootstrap5"
version = "0.1.0"
description = "Adds Bootstrap 5 components as plugins."
readme = "README.rst"
keywords = ["django", "django-cms", "bootstrap5", "plugins"]
authors = [
    {name = "Divio AG", email = "info@divio.ch"},
    {name = "Aymeric Derbois", email = "aymeric@kenlodin.com"}
]

requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django CMS",
    "Framework :: Django CMS :: 3.11",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "django-cms>=3.8",
    "django-filer>=1.7",
    "djangocms-attributes-field>=1",
    "djangocms-text-ckeditor>=3.1.0",
    "djangocms-icon>=1.4.0",
    "djangocms-link==3.*",
    "djangocms-picture>=2.3.0",
    "django-upgrade>=1.21.0",
]

[project.license]
text = "BSD-3-Clause"

[project.urls]
Homepage = "https://github.com/aymericderbois/djangocms-bootstrap5"
Repository = "https://github.com/aymericderbois/djangocms-bootstrap5"
Issues = "https://github.com/aymericderbois/djangocms-bootstrap5/issues"

[tool.uv]
conflicts = [
    # Django versions are mutually exclusive
    [
        { group = "django32" },
        { group = "django42" },
    ],
    # CMS versions are mutually exclusive
    [
        { group = "cms38" },
        { group = "cms39" },
        { group = "cms310" },
        { group = "cms311" },
    ],
    # Django 4.2 is incompatible with Django CMS 3.8/3.9/3.10
    [
        { group = "django42" },
        { group = "cms39" },
        { group = "cms310" },
    ],
]

[dependency-groups]
# Testing dependencies
test = [
    "coverage[toml]",
    "pytest",
    "pytest-django",
    "pytest-randomly",
    "django-app-helper",
    "django-mptt",
]

# Development dependencies
dev = [
    "tox",
    "tox-uv",
]

# Django version groups (compatible with Django CMS 3.7/3.8)
django32 = ["django>=3.2,<4.0"]
django42 = ["django>=4.2,<5.0"]

# Django CMS version groups
cms38 = ["django-cms>=3.8,<3.9", "django-treebeard<4.5"]
cms39 = ["django-cms>=3.9,<4.0", "django-treebeard<4.5"]
cms310 = ["django-cms>=3.10,<3.11", "django-treebeard<4.5"]
cms311 = ["django-cms>=3.11,<3.12", "django-treebeard<4.5"]

[tool.coverage.run]
branch = true
source = ["djangocms_bootstrap5"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--ds=tests.test_settings",
    "--import-mode=importlib",
    "--reuse-db",
]

[tool.setuptools.packages.find]
include = ["djangocms_bootstrap5*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
djangocms_bootstrap5 = [
    "*.html",
    "*.css",
    "*.js",
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
]
